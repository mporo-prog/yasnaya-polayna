# Include внутри HTTPS server {} для game.ypmuseum.ru.
# Требуется reload Nginx после проверки nginx -t.
# Два точных маршрута; остальные страницы обслуживает существующий сайт игры.
# CA-файл ниже — для Debian/Ubuntu; на другом дистрибутиве указать его системный CA bundle.

location = /request/subscribe-session {
    limit_except GET { deny all; }

    proxy_pass https://ypmuseum.ru/;
    proxy_set_header Host ypmuseum.ru;
    proxy_ssl_server_name on;
    proxy_ssl_name ypmuseum.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Origin https://ypmuseum.ru;
    proxy_set_header Referer https://ypmuseum.ru/;
    # Отдельная сессия основного сайта для посетителя игры.
    proxy_cookie_domain ypmuseum.ru game.ypmuseum.ru;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
}

location = /request/subscribe {
    limit_except POST { deny all; }
    # Браузерная отправка разрешена только со страницы игры.
    if ($http_origin != "https://game.ypmuseum.ru") { return 403; }

    client_max_body_size 4k;
    proxy_pass https://ypmuseum.ru/request/subscribe;
    proxy_set_header Host ypmuseum.ru;
    proxy_ssl_server_name on;
    proxy_ssl_name ypmuseum.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Origin https://ypmuseum.ru;
    proxy_set_header Referer https://ypmuseum.ru/;
    proxy_cookie_domain ypmuseum.ru game.ypmuseum.ru;
    # _csrf проверяет основной сайт; защиту не отключаем.
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
}
