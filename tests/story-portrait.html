<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Проверка финального портрета</title>
<style>
  body { margin: 16px; font: 16px system-ui; background: #efe8dc; color: #302820; }
  iframe { width: min(960px, 100%); aspect-ratio: 16 / 9; border: 0; }
  #captures { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; width: min(600px, 100%); }
  figure img { width: 100%; }
</style>
<h1>Сюжетная сцена 6</h1>
<label>Формат <select id="aspect"><option value="16 / 9">16:9</option><option value="4 / 3">4:3</option></select></label>
<label><input id="skip" type="checkbox"> Пропустить реплику во время GIF</label>
<button id="run">Проверить автоматический переход</button>
<pre id="results">GIF + текст + звук → портрет с подписью → финальный экран</pre>
<iframe id="site" title="Игра"></iframe>
<div id="captures"></div>
<script type="module">
  const output = document.querySelector('#results');
  const frame = document.querySelector('#site');
  const button = document.querySelector('#run');
  document.querySelector('#aspect').onchange = event => { frame.style.aspectRatio = event.target.value; };
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const waitFor = async (condition) => {
    const deadline = performance.now() + 30000;
    while (!condition()) {
      if (performance.now() > deadline) throw new Error('Timeout: ' + condition);
      await new Promise(resolve => setTimeout(resolve, 25));
    }
  };
  button.onclick = async () => {
    button.disabled = true;
    const skipVoice = document.querySelector('#skip').checked;
    const saves = new Map(['vn_save_v1', 'game4_save_v1', 'vn_audio_settings_v1']
      .map(key => [key, localStorage.getItem(key)]));
    output.textContent = 'Проверка…';
    document.querySelector('#captures').replaceChildren();
    const pass = text => { output.textContent += '\nPASS ' + text; };
    let game;
    const capture = label => new Promise(resolve => game.renderer.snapshot(image => {
      const figure = document.createElement('figure');
      const caption = document.createElement('figcaption');
      caption.textContent = label;
      figure.append(caption, image);
      document.querySelector('#captures').append(figure);
      resolve();
    }));
    try {
      localStorage.removeItem('vn_save_v1');
      localStorage.removeItem('game4_save_v1');
      localStorage.setItem('vn_audio_settings_v1', JSON.stringify({ music: 0, ui: 0, voice: 0 }));
      frame.src = '../';
      await waitFor(() => frame.contentWindow.game?.scene.isActive('MainMenuScene'));
      game = frame.contentWindow.game;
      // The Run button unlocks audio, but keep the browser test quiet.
      await game.sound.context.resume();
      game.scene.getScene('MainMenuScene').scene.start('StoryScene', { storySceneIndex: 5, screenIndex: 0 });
      await waitFor(() => game.scene.isActive('StoryScene'));
      const story = game.scene.getScene('StoryScene');
      await waitFor(() => story.portraitVideo?.video?.currentTime > 0.2);
      assert(story.portraitPhase === 'dialogue' && story.voiceActive, 'Video and voice start together');
      assert(story.bottomGroup.visible && story.historyBtn.bg.visible, 'Dialogue accompanies the animation');
      assert(Math.abs((game.getTime() - story.voiceStartTime) / 1000 - story.portraitVideo.video.currentTime) < 0.3,
        'Video and voice must share the same start');
      assert(!story.portraitVideo.video.loop && story.portraitVideo.video.muted, 'Silent, non-looping video');
      assert(story.portraitVideo.video.currentSrc.endsWith('/video/tolstoy-portrait-e1ebd194.mp4'),
        'Use the video converted from the attached GIF, not the old cached asset');
      assert(Math.abs(story.portraitVideo.video.duration - 9.67) < 0.1, 'Preserve the attached GIF timing');
      story.goBack();
      await capture('GIF, текст и озвучка одновременно');
      pass('Новый GIF 9,67 с, текст и озвучка начинаются вместе');
      story.openPauseMenu();
      await waitFor(() => game.scene.isActive('PauseScene'));
      const pausedAt = story.portraitVideo.video.currentTime;
      await new Promise(resolve => setTimeout(resolve, 250));
      assert(Math.abs(story.portraitVideo.video.currentTime - pausedAt) < 0.1, 'Video pauses with scene');
      game.scene.getScene('PauseScene').resumeGame();
      await waitFor(() => story.voiceActive);
      pass('Пауза останавливает видео и звук; продолжение возобновляет сцену');
      const voice = story.voiceTrack;
      if (skipVoice) {
        story.goNext();
        story.goNext();
        assert(voice.ended && !story.portraitVideo.video.ended, 'Skipping voice cannot end video');
        assert(story.portraitPhase === 'dialogue', 'Title must wait for video even after repeated clicks');
        pass('Пропуск реплики не обрывает GIF');
      }
      await waitFor(() => story.portraitPhase === 'hold');
      const holdAt = performance.now();
      assert(voice.ended, 'Wait for real audio end');
      assert(story.portraitVideo.video.ended, 'Wait for real video end too');
      assert(!story.bottomGroup.visible && !story.menuBtn.bg.visible && !story.historyBtn.bg.visible,
        'Only the painting and its title remain');
      const bounds = story.portraitTitle.getBounds();
      const camera = story.cameras.main;
      assert(bounds.left >= camera.scrollX && bounds.right <= camera.scrollX + camera.width,
        'The title must fit within the visible viewport');
      await capture('Портрет с названием');
      story.goNext();
      assert(story.portraitPhase === 'hold', 'Clicks cannot bypass the hold');
      await waitFor(() => frame.contentWindow.location.pathname.endsWith('/games/finish/index.html'));
      const elapsed = performance.now() - holdAt;
      assert(elapsed >= 3800 && elapsed < 6500, 'Configured four-second hold: ' + elapsed);
      const finishReady = () => frame.contentDocument.querySelector('.finish-replay-button')
        && frame.contentDocument.querySelectorAll('.finish-social-link').length === 2
        && frame.contentDocument.querySelector('canvas')?.width === 1920;
      await waitFor(finishReady);
      pass('Видео и звук завершились → подпись на 4 с → новый финальный экран загрузился');
      const reloaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
      frame.contentWindow.location.reload();
      await reloaded;
      await waitFor(finishReady);
      pass('Финальный экран работает и после перезагрузки');
      output.textContent += '\nDONE';
    } catch (error) {
      output.textContent += '\nFAIL ' + error.stack;
    } finally {
      // Restore the user's progress and audio settings after this test.
      frame.src = 'about:blank';
      await new Promise(resolve => setTimeout(resolve, 100));
      for (const [key, value] of saves) {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      }
      button.disabled = false;
    }
  };
</script>
</html>
